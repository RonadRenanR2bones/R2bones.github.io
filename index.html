html{min-height:100%}

.links{display:grid;gap:14px}
a.link{--accent:#23c98a;display:flex;align-items:center;gap:16px;text-align:left;text-decoration:none;color:var(--text);border:1px solid var(--stroke);border-left:3px solid var(--accent);background:linear-gradient(115deg,#191e27,#11151c);border-radius:16px;padding:17px 18px;min-height:80px;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
a.link:hover,a.link:focus-visible{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 26px #0005;outline:none}
.link.instagram{--accent:#e65ab2}.link.catalogo{--accent:#ffad35}
.icon{width:42px;height:42px;flex:none;display:grid;place-items:center;color:var(--accent)}
.icon svg{width:31px;height:31px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.copy{flex:1;min-width:0}.copy strong{display:block;font-size:1rem;line-height:1.3}.copy small{display:block;color:var(--muted);font-size:.79rem;margin-top:4px}.arrow{font-size:1.45rem;color:#a7b0bd}
footer{margin-top:32px;color:#a7b0bd;font-size:.74rem;letter-spacing:.09em}
.colors{margin:25px auto 0;display:flex;justify-content:center;gap:5px;max-width:190px}.colors i{display:block;height:3px;flex:1;border-radius:9px}
@media(max-width:360px){.link{padding:15px 12px!important;gap:11px!important}.copy strong{font-size:.94rem}}
@media(prefers-reduced-motion:reduce){a.link{transition:none}}
