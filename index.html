
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <meta name="description"
        content="R² Bonés — Acesse nosso WhatsApp, Instagram e catálogo.">

  <meta property="og:title" content="R² Bonés | Links oficiais">
  <meta property="og:description"
        content="Seu próximo boné está aqui. Confira nossos canais oficiais.">

  <title>R² Bonés | Links oficiais</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #090b10;
      --panel: #151920;
      --text: #f7f9fc;
      --muted: #a8b0bb;
      --stroke: #303743;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100svh;
      font-family: system-ui, -apple-system,
                   BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(
        ellipse at 50% 4%,
        #172030 0%,
        var(--bg) 58%
      );
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 36px 18px;
    }

    main {
      width: min(100%, 450px);
      text-align: center;
    }

    /* LOGOMARCA */

    header {
      margin-bottom: 32px;
    }

    .logo {
      width: min(100%, 355px);
      height: auto;
      display: block;
      margin: 0 auto;
      mix-blend-mode: screen;
    }

    /* BOTÕES */

    .links {
      display: grid;
      gap: 14px;
    }

    a.link {
      --accent: #23c98a;

      display: flex;
      align-items: center;
      gap: 16px;

      text-align: left;
      text-decoration: none;
      color: var(--text);

      border: 1px solid var(--stroke);
      border-left: 3px solid var(--accent);

      background: linear-gradient(
        115deg,
        #191e27,
        #11151c
      );

      border-radius: 16px;
      padding: 17px 18px;
      min-height: 80px;

      transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
    }

    a.link:hover,
    a.link:focus-visible {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 8px 26px #0005;
      outline: none;
    }

    .link.instagram {
      --accent: #e65ab2;
    }

    .link.catalogo {
      --accent: #ffad35;
    }

    /* ÍCONES */

    .icon {
      width: 42px;
      height: 42px;
      flex: none;
      display: grid;
      place-items: center;
      color: var(--accent);
    }

    .icon svg {
      width: 31px;
      height: 31px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* TEXTOS DOS BOTÕES */

    .copy {
      flex: 1;
      min-width: 0;
    }

    .copy strong {
      display: block;
      font-size: 1rem;
      line-height: 1.3;
    }

    .copy small {
      display: block;
      color: var(--muted);
      font-size: .79rem;
      margin-top: 4px;
    }

    .arrow {
      font-size: 1.45rem;
      color: #a7b0bd;
    }

    /* RODAPÉ */

    footer {
      margin-top: 32px;
    }

    .colors {
      margin: 0 auto;
      display: flex;
      justify-content: center;
      gap: 5px;
      max-width: 190px;
    }

    .colors i {
      display: block;
      height: 3px;
      flex: 1;
      border-radius: 9px;
    }

    /* CELULARES */

    @media (max-width: 480px) {
      body {
        padding: 28px 20px;
      }

      header {
        margin-bottom: 26px;
      }

      .logo {
        width: min(100%, 320px);
      }

      .links {
        gap: 12px;
      }

      a.link {
        min-height: 76px;
      }
    }

    @media (max-width: 360px) {
      a.link {
        padding: 15px 12px;
        gap: 11px;
      }

      .copy strong {
        font-size: .94rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      a.link {
        transition: none;
      }
    }
  </style>
</head>

<body>

<main>

  <!-- LOGOMARCA -->

  <header>
    <img
      class="logo"
      src="./logo-r2.png"
      alt="Logomarca R² Bonés"
      width="735"
      height="295"
      decoding="async"
    >
  </header>

  <!-- LINKS OFICIAIS -->

  <nav class="links" aria-label="Canais oficiais da R² Bonés">

    <!-- 1. INSTAGRAM -->

    <a
      class="link instagram"
      href="https://www.instagram.com/r2.bones/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Acessar Instagram da R² Bonés"
    >

      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <path d="M17.5 6.5h.01"/>
        </svg>
      </span>

      <span class="copy">
        <strong>Siga no Instagram</strong>
        <small>@r2.bones</small>
      </span>

      <span class="arrow" aria-hidden="true">↗</span>

    </a>

    <!-- 2. WHATSAPP -->

    <a
      class="link whatsapp"
      href="https://wa.me/5521992682786?text=Ol%C3%A1%21%20Conheci%20a%20R%C2%B2%20Bon%C3%A9s%20e%20quero%20saber%20mais."
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Conversar com a R² Bonés pelo WhatsApp"
    >

      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3 21l1.9-5.7A8.5 8.5 0 1 1 21 11.5Z"/>
          <path d="M8.5 8.3c.5-.4 1.1-.3 1.3.2l.7 1.6c.1.3 0 .6-.2.8l-.6.7c.6 1.2 1.5 2.1 2.7 2.7l.7-.6c.2-.2.5-.3.8-.2l1.6.7c.5.2.6.8.2 1.3-.5.7-1.3 1.1-2.2.9-3.3-.7-5.7-3.1-6.4-6.4-.2-.9.2-1.7.9-2.2Z"/>
        </svg>
      </span>

      <span class="copy">
        <strong>Fale com a gente</strong>
        <small>Atendimento pelo WhatsApp</small>
      </span>

      <span class="arrow" aria-hidden="true">↗</span>

    </a>

    <!-- 3. CATÁLOGO -->

    <a
      class="link catalogo"
      href="https://loja.infinitepay.io/r2-bones"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Abrir catálogo da R² Bonés"
    >

      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M4 8h16l-1 13H5L4 8Z"/>
          <path d="M9 9V6a3 3 0 0 1 6 0v3"/>
        </svg>
      </span>

      <span class="copy">
        <strong>Ver catálogo</strong>
        <small>Escolha seu próximo boné</small>
      </span>

      <span class="arrow" aria-hidden="true">↗</span>

    </a>

  </nav>

  <!-- BARRAS COLORIDAS -->

  <footer>
    <div class="colors" aria-hidden="true">
      <i style="background:#f43b48"></i>
      <i style="background:#ff9a32"></i>
      <i style="background:#f8d044"></i>
      <i style="background:#3aca70"></i>
      <i style="background:#278cff"></i>
      <i style="background:#9a48e5"></i>
    </div>
  </footer>

</main>

</body>
</html>
